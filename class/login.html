<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moniepoint Login</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #06235B;
        background-size: cover;
        background-position: center;
        color: #fff;
    }

    .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 45px 20px;
        gap: 25px;
    }

    .logo img {
        width: 60px;
        height: 60px;
        border-radius: 10px;
        margin-bottom: -10px;
    }

    .title {
        font-size: 32px;
        font-weight: 700;
        text-align: center;
        line-height: 1.2;
    }

    /* WHITE LOGIN BOX */
    .login-box {
        width: 100%;
        max-width: 430px;
        background: #fff;
        border-radius: 16px;
        padding: 35px 25px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        color: #000;
    }

    .tabs {
        display: flex;
        gap: 30px;
        font-weight: 600;
        margin-bottom: 20px;
        cursor: pointer;
    }

    .tab {
        position: relative;
        padding-bottom: 6px;
        color: #444;
    }

    .tab.active {
        color: #0A2B66;
    }

    .tab.active::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 60%;
        height: 2px;
        background: #0A7AFF;
        border-radius: 10px;
    }

    .phone-row {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid #ddd;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 15px;
    }

    .phone-row input {
        border: none;
        outline: none;
        flex: 1;
        font-size: 15px;
    }

    .input-box {
        width: 100%;
        border: 1px solid #ddd;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 5px;
        font-size: 15px;
    }

    .forgot {
        text-align: right;
        margin-bottom: 15px;
    }

    .forgot a {
        color: #0A7AFF;
        text-decoration: none;
    }

    .login-btn {
        width: 100%;
        padding: 14px;
        background: #D6D6D6;
        border: none;
        cursor: pointer;
        border-radius: 10px;
        font-size: 17px;
        margin-top: 5px;
    }

    /* ADDED BACK */
    .change-phone {
        text-align: center;
        margin-top: 15px;
    }

    .change-phone a {
        color: #0A7AFF;
        font-size: 14px;
        text-decoration: none;
        font-weight: 500;
    }

    .lost-phone {
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
        color: #444;
    }

    .lost-phone a {
        color: #0A7AFF;
        font-weight: 600;
        text-decoration: none;
    }

    /* SIGN UP BOX */
    .signup-box {
        background: rgba(255,255,255,0.14);
        padding: 12px 25px;
        border-radius: 25px;
        backdrop-filter: blur(10px);
        font-size: 15px;
        margin-top: 10px;
    }

    .signup-box a {
        color: #fff;
        font-weight: bold;
        text-decoration: none;
    }

    .footer {
        text-align: center;
        font-size: 13px;
        color: #dcdcdc;
        max-width: 360px;
        line-height: 1.5;
    }

    @media (max-width: 480px) {
        .login-box { padding: 25px 18px; }
        .title { font-size: 26px; }
    }

</style>
</head>

<body>

<div class="wrapper">

    <div class="logo">
        <img src="download (7).jpg">
    </div>

    <div class="title">
        Log In to<br>Moniepoint
    </div>

    <div class="login-box">

        <div class="tabs">
            <div class="tab active" id="phoneTab">Phone Number</div>
            <div class="tab" id="userTab">Username</div>
        </div>

        <!-- PHONE LOGIN -->
        <div id="phoneLogin">
            <div class="phone-row">
                <img src="download (4).png" width="24">
                <span>+234</span>
                <input type="text" placeholder="Phone Number">
            </div>
        </div>

        <!-- USERNAME LOGIN -->
        <div id="userLogin" style="display:none;">
            <input class="input-box" type="text" placeholder="Enter Username">
            <div class="forgot"><a href="#">Forgot Username?</a></div>
        </div>

        <button class="login-btn">Next</button>

        <!-- ADDED BACK -->
        <div class="change-phone">
            <a href="#">Change My Phone Number</a>
        </div>

        <div class="lost-phone">
            Lost your phone? <a href="#">Lock your Account 🔒</a>
        </div>

    </div>

    <div class="signup-box">
        New to Moniepoint? <a href="sign in.html">Sign Up</a>
    </div>

    <div class="footer">
        Licensed by the <b>Central Bank of Nigeria</b> and insured by the <b>NDIC</b>.
    </div>

</div>

<script>
    const phoneTab = document.getElementById("phoneTab");
    const userTab  = document.getElementById("userTab");

    const phoneLogin = document.getElementById("phoneLogin");
    const userLogin  = document.getElementById("userLogin");

    phoneTab.onclick = () => {
        phoneTab.classList.add("active");
        userTab.classList.remove("active");
        phoneLogin.style.display = "block";
        userLogin.style.display = "none";
    };

    userTab.onclick = () => {
        userTab.classList.add("active");
        phoneTab.classList.remove("active");
        phoneLogin.style.display = "none";
        userLogin.style.display = "block";
    };
</script>

</body>
</html>
